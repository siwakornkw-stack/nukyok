# /etc/nginx/sites-available/nukyok  (symlinked into sites-enabled)
# HTTP only as installed; `certbot --nginx -d nukyok.phuketnukyok.com` then adds
# the 443 server and the redirect to this block, like the other sites on the box.
server {
    listen 80;
    listen [::]:80;
    server_name nukyok.phuketnukyok.com;

    client_max_body_size 100m;  # up to 10 phone photos / PDFs per form

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
